<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 40-item timed IQ test: matrix puzzles, number series, verbal and logic, and working memory, scored with item-response theory.">
<meta property="og:title" content="Four-Domain IQ Test">
<meta property="og:description" content="40 items, about 30 minutes. Get an IQ estimate with a 90% confidence range.">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Four-Domain IQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single test-booklet column; one item per screen, header strip carries section, item count and clock */
:root {
  --bg: #E7ECEF;
  --card: #F8FAFB;
  --ink: #152033;
  --muted: #586478;
  --line: #C6CFD8;
  --mid: #98A3B3;
  --accent: #1D4ACB;
  --accent-ink: #FFFFFF;
  --sel: #DBE4FB;
  --good: #1D7A4C;
  --warn: #A9521C;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --card: #161D28; --ink: #E5EAF2; --muted: #9AA6B8; --line: #2B3546;
    --mid: #5E697B; --accent: #7393FF; --accent-ink: #0A0F1E; --sel: #1E2945; --good: #4CC38A; --warn: #F0965A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --card: #161D28; --ink: #E5EAF2; --muted: #9AA6B8; --line: #2B3546;
  --mid: #5E697B; --accent: #7393FF; --accent-ink: #0A0F1E; --sel: #1E2945; --good: #4CC38A; --warn: #F0965A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 48px; }
#app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: clamp(1.5rem, 4.5vw, 2rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; max-width: 65ch; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 1.12rem; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.facts div { padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.facts div:first-child { border-left: 0; }
.facts b { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.facts span { font-size: 0.82rem; color: var(--muted); }
@media (max-width: 560px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts div:nth-child(3) { border-left: 0; }
  .facts div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.sections { display: grid; gap: 0; border-top: 1px solid var(--line); }
.sections .row { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.sections .row .n { font-family: var(--f-mono); color: var(--muted); }
.sections .row .t { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.sections .row p { color: var(--muted); font-size: 0.92rem; }
.btn { font: 600 1rem var(--f-body); border-radius: 8px; padding: 12px 22px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); filter: none; }
.btn:disabled { opacity: 0.4; cursor: default; filter: none; }
.btn:focus-visible, .opt:focus-visible, .vopt:focus-visible, .dot:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 0.88rem; color: var(--muted); }

/* test header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.clock { font-family: var(--f-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--warn); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: 500 0.75rem var(--f-mono); cursor: pointer; padding: 0; }
.dot.done { background: var(--sel); color: var(--ink); border-color: var(--accent); }
.dot.cur { outline: 2px solid var(--ink); outline-offset: 1px; }

/* matrices */
.matrix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(100%, 390px); margin: 0 auto; border: 2px solid var(--ink); background: var(--card); }
.matrix .cell { aspect-ratio: 1; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; }
.matrix .cell:nth-child(3n) { border-right: 0; }
.matrix .cell:nth-child(n+7) { border-bottom: 0; }
.matrix .cell svg { width: 100%; height: 100%; }
.matrix .cell.q { font: 700 2.4rem var(--f-display); color: var(--accent); background: var(--sel); }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(100%, 520px); margin: 0 auto; }
.opt { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0; cursor: pointer; color: var(--ink); }
.opt svg { width: 100%; height: 100%; display: block; }
.opt:hover { border-color: var(--ink); }
.opt.on { border: 2px solid var(--accent); background: var(--sel); }
.opt .k { position: absolute; top: 4px; left: 6px; font: 500 0.7rem var(--f-mono); color: var(--muted); }
.opt.right { border: 2px solid var(--good); }
.opt.wrong { border: 2px solid var(--warn); }

/* series */
.seq { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seq span { font: 500 clamp(1.1rem, 4vw, 1.6rem) var(--f-mono); min-width: 3.2rem; padding: 10px 12px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font-variant-numeric: tabular-nums; }
.seq span.q { border: 2px dashed var(--accent); color: var(--accent); }
.num-in { font: 500 1.5rem var(--f-mono); width: min(100%, 220px); padding: 10px 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--ink); text-align: center; margin: 0 auto; display: block; }
.num-in:focus { border-color: var(--accent); }

/* verbal */
.stem { font-size: 1.2rem; font-weight: 500; }
.vopts { display: flex; flex-direction: column; gap: 8px; }
.vopt { text-align: left; font: 400 1rem var(--f-body); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
.vopt:hover { border-color: var(--ink); }
.vopt.on { border: 2px solid var(--accent); background: var(--sel); }
.vopt .k { font: 500 0.8rem var(--f-mono); color: var(--muted); }

/* memory */
.digit-stage { height: 180px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.digit { font: 800 6rem var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .digit { animation: pop 0.18s ease-out; } }
@keyframes pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: none; opacity: 1; } }

.qfoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm { border: 1px solid var(--warn); border-radius: 8px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* results */
.score { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: end; }
.score .big { font: 800 clamp(4.5rem, 18vw, 7.5rem) var(--f-display); line-height: 0.9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score .meta { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; min-width: 0; }
.band { display: inline-block; font: 600 0.82rem var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
@media (max-width: 480px) { .score { grid-template-columns: 1fr; gap: 8px; } }
.curve { width: 100%; height: auto; display: block; }
.domains { display: flex; flex-direction: column; gap: 14px; }
.dom { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 3.5rem; gap: 12px; align-items: center; }
.dom .lab { font-weight: 500; font-size: 0.95rem; }
.dom .lab small { display: block; color: var(--muted); font: 400 0.78rem var(--f-mono); }
.dom .track { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
.dom .track .ci { position: absolute; top: -1px; bottom: -1px; background: var(--sel); border-radius: 5px; }
.dom .track .pt { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }
.dom .track .mid { position: absolute; top: -4px; bottom: -4px; left: 50%; width: 1px; background: var(--muted); }
.dom .v { font: 500 1rem var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .dom { grid-template-columns: minmax(0, 1fr) 3rem; } .dom .track { grid-column: 1 / -1; grid-row: 2; } }
.share-text { width: 100%; font: 400 0.9rem var(--f-mono); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: none; }
ul.plain { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.sample { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; align-items: center; }
.sample .matrix { width: 100%; }
.sample .opts { grid-template-columns: repeat(3, minmax(0, 72px)); margin: 0; width: auto; }
@media (max-width: 520px) { .sample { grid-template-columns: 1fr; } .sample .matrix { width: min(100%, 220px); } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" style="fill:var(--card)"/>
      <line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink);stroke-width:2"/>
    </pattern>
  </defs>
</svg>

<main id="app"></main>

<script id="core">
/* ---------- figure rendering ---------- */
var SIZE_R = {1: 15, 2: 23, 3: 33};
var COUNT_R = {2: 16, 3: 14, 4: 13, 5: 11, 6: 10.5};
var POS = {
  1: [[50, 50]],
  2: [[29, 50], [71, 50]],
  3: [[50, 29], [28, 71], [72, 71]],
  4: [[29, 29], [71, 29], [29, 71], [71, 71]],
  5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]],
  6: [[21, 33], [50, 33], [79, 33], [21, 67], [50, 67], [79, 67]]
};
var VIS = {circle: 0.84, square: 0.9, triangle: 1.08, diamond: 1, pentagon: 0.96, hexagon: 0.94, arrow: 1};
var POLY = {triangle: [3, -90], square: [4, -45], diamond: [4, -90], pentagon: [5, -90], hexagon: [6, 0]};
var ARROW = [[0, -1], [0.62, -0.18], [0.24, -0.18], [0.24, 0.92], [-0.24, 0.92], [-0.24, -0.18], [-0.62, -0.18]];
var LINES = [[16,16,84,16],[16,84,84,84],[16,16,16,84],[84,16,84,84],[16,16,84,84],[84,16,16,84],[50,16,50,84],[16,50,84,50]];

function r2(n) { return Math.round(n * 100) / 100; }
function fillStyle(f) {
  return f === 'solid' ? 'var(--ink)' : f === 'grey' ? 'var(--mid)' : f === 'stripe' ? 'url(#hatch)' : 'var(--card)';
}
function shapeEl(shape, cx, cy, r, rot, fill) {
  r = r * (VIS[shape] || 1);
  var st = 'fill:' + fillStyle(fill) + ';stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round';
  if (shape === 'circle') return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r2(r) + '" style="' + st + '"/>';
  var pts = [];
  if (shape === 'arrow') {
    pts = ARROW.map(function (p) { return [cx + p[0] * r, cy + p[1] * r]; });
  } else {
    var n = POLY[shape][0], a0 = POLY[shape][1];
    for (var i = 0; i < n; i++) {
      var a = (a0 + 360 * i / n) * Math.PI / 180;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }
  var tf = rot ? ' transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')"' : '';
  return '<polygon points="' + pts.map(function (p) { return r2(p[0]) + ',' + r2(p[1]); }).join(' ') + '"' + tf + ' style="' + st + '"/>';
}
function norm(c) {
  return {
    shape: c.shape || null, count: c.count || 1, size: c.size || 2, fill: c.fill || 'none',
    rot: (((c.rot || 0) % 360) + 360) % 360, inner: c.inner || null, innerFill: c.innerFill || 'solid', lines: c.lines || 0
  };
}
function cellKey(c) { return JSON.stringify(norm(c)); }
function cellSVG(c) {
  c = norm(c);
  var s = '';
  for (var i = 0; i < LINES.length; i++) {
    if (c.lines & (1 << i)) {
      var L = LINES[i];
      s += '<line x1="' + L[0] + '" y1="' + L[1] + '" x2="' + L[2] + '" y2="' + L[3] + '" style="stroke:var(--ink);stroke-width:3.2;stroke-linecap:round"/>';
    }
  }
  if (c.shape) {
    var r = c.count === 1 ? SIZE_R[c.size] : COUNT_R[c.count];
    POS[c.count].forEach(function (p) { s += shapeEl(c.shape, p[0], p[1], r, c.rot, c.fill); });
  }
  if (c.inner) s += shapeEl(c.inner, 50, 50, 12, 0, c.innerFill);
  return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' + s + '</svg>';
}
function Lm() { var m = 0; for (var i = 0; i < arguments.length; i++) m |= 1 << arguments[i]; return m; }
function set(k, v) { return function (c) { var o = Object.assign({}, c); o[k] = v; return o; }; }
function tog(bit) { return function (c) { var o = Object.assign({}, c); o.lines = (o.lines || 0) ^ (1 << bit); return o; }; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- matrix items ----------
   Each item: a cell rule f(row, col); the answer is f(2,2).
   Eight options = every combination of three single-attribute changes,
   so each wrong value appears in exactly half the options and the answer
   cannot be found by picking the most common features. */
var MATRIX_DEF = [
  { b: -2.3, f: function (r, c) { return {shape: ['circle', 'square', 'triangle'][r], size: c + 1}; },
    p: [set('size', 2), set('shape', 'square'), set('fill', 'solid')] },
  { b: -1.7, f: function (r, c) { return {shape: ['diamond', 'circle', 'hexagon'][r], count: c + 1, fill: 'solid'}; },
    p: [set('count', 2), set('shape', 'pentagon'), set('fill', 'none')] },
  { b: -1.2, f: function (r, c) { return {shape: ['circle', 'triangle', 'square'][(r + c) % 3], fill: ['none', 'grey', 'solid'][r]}; },
    p: [set('shape', 'square'), set('fill', 'grey'), set('size', 3)] },
  { b: -0.7, f: function (r, c) { return {shape: 'arrow', rot: 90 * c + 45 * r, fill: ['none', 'solid', 'grey'][r]}; },
    p: [set('rot', 90), set('fill', 'solid'), set('size', 1)] },
  { b: -0.2, f: function (r, c) {
      return {shape: ['pentagon', 'circle', 'diamond'][(r + c) % 3], count: ((c - r + 3) % 3) + 1, fill: ['none', 'grey', 'solid'][(r + 2 * c) % 3]};
    },
    p: [set('count', 3), set('shape', 'diamond'), set('fill', 'solid')] },
  { b: 0.0, f: function (r, c) {
      return {shape: ['circle', 'square', 'hexagon'][c], size: 3, inner: ['triangle', 'circle', 'square'][r], innerFill: ['solid', 'none', 'grey'][(r + c) % 3]};
    },
    p: [set('shape', 'square'), set('inner', 'triangle'), set('innerFill', 'solid')] },
  { b: 0.4, f: function (r, c) {
      var A = [Lm(0, 4), Lm(2, 6), Lm(3, 5)][r], B = [Lm(4, 7), Lm(6, 1), Lm(5, 0)][r];
      return {lines: [A, B, A ^ B][c]};
    },
    p: [tog(5), tog(7), tog(2)] },
  { b: 0.6, f: function (r, c) {
      var row = [[1, 2, 3], [2, 2, 4], [1, 4, 5]][r];
      return {shape: ['square', 'circle', 'triangle'][(r + c) % 3], count: row[c], fill: ['solid', 'none', 'grey'][r]};
    },
    p: [set('count', 6), set('shape', 'triangle'), set('fill', 'solid')] },
  { b: 0.9, f: function (r, c) {
      return {shape: 'arrow', rot: 90 * r + 45 * c, fill: ['none', 'solid', 'stripe'][(r + c) % 3], size: ((2 * r + c) % 3) + 1};
    },
    p: [set('rot', 90), set('fill', 'stripe'), set('size', 2)] },
  { b: 1.2, f: function (r, c) {
      var A = [Lm(0, 1, 4, 6), Lm(2, 3, 5, 7), Lm(0, 2, 4, 5)][r], B = [Lm(4, 7), Lm(2, 6), Lm(1, 4)][r];
      return {lines: [A, B, A & ~B][c]};
    },
    p: [tog(1), tog(4), tog(7)] },
  { b: 1.5, f: function (r, c) {
      return {shape: ['circle', 'square', 'hexagon'][(r + c) % 3], size: 3, inner: ['triangle', 'diamond', 'circle'][(r + 2 * c) % 3],
              fill: ['none', 'grey', 'stripe'][(2 * r + c) % 3], innerFill: 'solid'};
    },
    p: [set('shape', 'hexagon'), set('inner', 'diamond'), set('fill', 'stripe')] },
  { b: 1.9, f: function (r, c) {
      var row = [[5, 2, 3], [6, 2, 4], [4, 3, 1]][r];
      return {shape: ['diamond', 'pentagon', 'circle'][(c - r + 3) % 3], count: row[c], fill: ['solid', 'none', 'grey'][(r + c) % 3]};
    },
    p: [set('count', 2), set('shape', 'pentagon'), set('fill', 'grey')] }
];

var MATRIX = MATRIX_DEF.map(function (d, i) {
  var grid = [];
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) grid.push(norm(d.f(r, c)));
  var answer = grid[8];
  var opts = [];
  for (var m = 0; m < 8; m++) {
    var cell = answer;
    for (var k = 0; k < 3; k++) if (m >> k & 1) cell = norm(d.p[k](cell));
    opts.push({cell: cell, isAns: m === 0});
  }
  var rnd = mulberry32(9173 + i * 131);
  for (var j = opts.length - 1; j > 0; j--) { var x = Math.floor(rnd() * (j + 1)); var t = opts[j]; opts[j] = opts[x]; opts[x] = t; }
  return {
    id: 'm' + (i + 1), type: 'matrix', b: d.b, a: 1.5, c: 1 / 8, grid: grid,
    options: opts.map(function (o) { return o.cell; }),
    correct: opts.findIndex(function (o) { return o.isAns; })
  };
});

/* ---------- number series ---------- */
var SERIES = [
  {seq: [3, 7, 11, 15, 19], ans: 23, b: -2.0},
  {seq: [2, 6, 18, 54], ans: 162, b: -1.3},
  {seq: [1, 1, 2, 3, 5, 8, 13], ans: 21, b: -0.8},
  {seq: [3, 5, 9, 15, 23, 33], ans: 45, b: -0.4},
  {seq: [4, 9, 7, 12, 10, 15], ans: 13, b: 0.0},
  {seq: [2, 3, 5, 9, 17, 33], ans: 65, b: 0.2},
  {seq: [2, 5, 11, 23, 47], ans: 95, b: 0.6},
  {seq: [100, 99, 95, 86, 70], ans: 45, b: 1.1},
  {seq: [2, 3, 10, 15, 26, 35], ans: 50, b: 1.6},
  {seq: [1, 2, 4, 7, 28, 33, 198], ans: 205, b: 2.0}
].map(function (d, i) { return {id: 'n' + (i + 1), type: 'series', seq: d.seq, ans: d.ans, b: d.b, a: 1.5, c: 0}; });

/* ---------- verbal & logic ---------- */
var VERBAL = [
  {stem: 'Caterpillar is to butterfly as tadpole is to …', o: ['Pond', 'Fish', 'Frog', 'Egg', 'Lily pad'], ans: 2, b: -1.8},
  {stem: 'Bird is to flock as fish is to …', o: ['Fin', 'School', 'Swarm', 'Ocean', 'Gill'], ans: 1, b: -1.1},
  {stem: 'All bloops are razzies. All razzies are lazzies. Therefore all bloops are definitely lazzies.', o: ['True', 'False', 'Cannot be determined'], ans: 0, b: -0.9},
  {stem: 'Thermometer is to temperature as odometer is to …', o: ['Speed', 'Fuel', 'Pressure', 'Distance', 'Time'], ans: 3, b: -0.6},
  {stem: 'Tom is taller than Ana. Ana is taller than Sue. Sue is taller than Ben. Who is the second shortest?', o: ['Tom', 'Ana', 'Sue', 'Ben'], ans: 2, b: -0.3},
  {stem: 'Which word does not belong with the others?', o: ['Copper', 'Iron', 'Bronze', 'Zinc', 'Silver'], ans: 2, b: 0.1},
  {stem: 'Ephemeral is to permanent as sparse is to …', o: ['Scattered', 'Dense', 'Rare', 'Brief', 'Empty'], ans: 1, b: 0.4},
  {stem: 'Some doctors are runners. All runners are early risers. Which statement must be true?', o: ['All doctors are early risers', 'All early risers are runners', 'Some doctors are early risers', 'No doctor is an early riser', 'None of these must be true'], ans: 2, b: 0.5},
  {stem: 'Which shape name does not belong with the others?', o: ['Square', 'Rectangle', 'Rhombus', 'Trapezoid', 'Parallelogram'], ans: 3, b: 0.9},
  {stem: 'Abstemious is to drinking as frugal is to …', o: ['Saving', 'Eating', 'Spending', 'Wealth', 'Generosity'], ans: 2, b: 1.2},
  {stem: 'Which word is closest in meaning to OBDURATE?', o: ['Obvious', 'Durable', 'Gloomy', 'Stubborn', 'Gentle'], ans: 3, b: 1.4},
  {stem: 'Pusillanimous is to courage as insipid is to …', o: ['Wisdom', 'Flavor', 'Kindness', 'Volume', 'Honesty'], ans: 1, b: 1.9}
].map(function (d, i) { return {id: 'v' + (i + 1), type: 'verbal', stem: d.stem, options: d.o, correct: d.ans, b: d.b, a: 1.3, c: 1 / d.o.length}; });

/* ---------- working memory: backward digit span ---------- */
var MEMORY = [
  {d: '952', b: -2.3}, {d: '3816', b: -1.4}, {d: '74291', b: -0.5},
  {d: '538164', b: 0.4}, {d: '2964713', b: 1.3}, {d: '61839427', b: 2.1}
].map(function (x, i) { return {id: 'w' + (i + 1), type: 'memory', digits: x.d, ans: x.d.split('').reverse().join(''), b: x.b, a: 1.2, c: 0}; });

var SECTIONS = [
  {key: 'matrix', name: 'Matrix Reasoning', short: 'Matrices', minutes: 10, items: MATRIX,
   what: 'Find the figure that completes each 3×3 pattern.',
   how: 'Each grid follows rules that run across the rows and down the columns: shape, number, shading, size, rotation, or which lines are present. Pick the one option of eight that fits every rule at once.'},
  {key: 'series', name: 'Number Series', short: 'Numbers', minutes: 7, items: SERIES,
   what: 'Type the number that comes next.',
   how: 'Each sequence follows one rule. Some rules change the step size, some alternate between two operations. Type a whole number. No calculator.'},
  {key: 'verbal', name: 'Verbal & Logic', short: 'Verbal', minutes: 6, items: VERBAL,
   what: 'Analogies, vocabulary and short deductions.',
   how: 'Choose the best answer. For logic questions, use only what the statements say, not what you know about the real world.'},
  {key: 'memory', name: 'Working Memory', short: 'Memory', minutes: 0, items: MEMORY,
   what: 'Remember digits, then type them in reverse order.',
   how: 'Digits appear one at a time. When they stop, type them backwards: if you see 2 – 7 – 4, type 472. Each list is shown once. No writing anything down.'}
];
var ALL_ITEMS = [].concat(MATRIX, SERIES, VERBAL, MEMORY);

/* ---------- scoring: 3-parameter IRT, EAP estimate on a normal prior ---------- */
function pCorrect(it, th) { return it.c + (1 - it.c) / (1 + Math.exp(-it.a * (th - it.b))); }
function eap(items, resp) {
  var num = 0, den = 0, sq = 0;
  for (var th = -4; th <= 4.0001; th += 0.02) {
    var L = Math.exp(-th * th / 2);
    items.forEach(function (it) { var p = pCorrect(it, th); L *= resp[it.id] ? p : 1 - p; });
    den += L; num += L * th; sq += L * th * th;
  }
  var m = num / den;
  return {theta: m, se: Math.sqrt(Math.max(sq / den - m * m, 0))};
}
function isCorrect(it, a) {
  if (a === undefined || a === null || a === '') return false;
  if (it.type === 'matrix' || it.type === 'verbal') return a === it.correct;
  if (it.type === 'series') return Number(String(a).trim()) === it.ans;
  if (it.type === 'memory') return String(a).replace(/\D/g, '') === it.ans;
  return false;
}
function normCdf(z) {
  var t = 1 / (1 + 0.2316419 * Math.abs(z));
  var d = 0.3989423 * Math.exp(-z * z / 2);
  var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function band(iq) {
  if (iq >= 130) return 'Extremely high';
  if (iq >= 120) return 'Very high';
  if (iq >= 110) return 'High average';
  if (iq >= 90) return 'Average';
  if (iq >= 80) return 'Low average';
  if (iq >= 70) return 'Very low';
  return 'Extremely low';
}
function scoreAll(answers) {
  var resp = {};
  ALL_ITEMS.forEach(function (it) { resp[it.id] = isCorrect(it, answers[it.id]); });
  var g = eap(ALL_ITEMS, resp);
  var iq = Math.round(100 + 15 * g.theta);
  var half = Math.round(1.645 * 15 * g.se);
  return {
    iq: iq, lo: iq - half, hi: iq + half, pct: normCdf(g.theta) * 100, band: band(iq),
    raw: ALL_ITEMS.filter(function (it) { return resp[it.id]; }).length, total: ALL_ITEMS.length,
    domains: SECTIONS.map(function (s) {
      var d = eap(s.items, resp);
      return {name: s.name, right: s.items.filter(function (it) { return resp[it.id]; }).length, n: s.items.length,
              index: Math.round(100 + 15 * d.theta), half: Math.round(1.645 * 15 * d.se)};
    })
  };
}
</script>

<script>
var app = document.getElementById('app');
var S;
function fresh() { return {screen: 'intro', sec: 0, idx: 0, ans: {}, deadline: 0, timedOut: false, confirm: false, mem: {trial: 0, phase: 'ready', shown: -1}, sample: null}; }
S = fresh();

var SAMPLE_GRID = [];
for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) SAMPLE_GRID.push({shape: ['circle', 'square', 'diamond'][r], fill: ['none', 'grey', 'solid'][c]});
var SAMPLE_OPTS = [{shape: 'diamond', fill: 'grey'}, {shape: 'diamond', fill: 'solid'}, {shape: 'square', fill: 'solid'}];

function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]; }); }
function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function matrixGrid(grid) {
  return '<div class="matrix">' + grid.map(function (cell, k) {
    return k === 8 ? '<div class="cell q">?</div>' : '<div class="cell">' + cellSVG(cell) + '</div>';
  }).join('') + '</div>';
}

/* ---------- screens ---------- */
function introHTML() {
  var last = load('fdiq-last');
  var sample = S.sample;
  return '' +
  '<header class="stack">' +
    '<span class="eyebrow">Standard score scale · mean 100 · SD 15</span>' +
    '<h1>Four-Domain IQ Test</h1>' +
    '<p class="lead">Forty timed items across abstract reasoning, numerical reasoning, verbal reasoning and working memory. Your answers are scored with the same kind of statistical model used by professional tests, and you get an estimate with an honest margin of error.</p>' +
  '</header>' +
  '<div class="facts">' +
    '<div><b>40</b><span>items</span></div>' +
    '<div><b>~30</b><span>minutes</span></div>' +
    '<div><b>4</b><span>sections</span></div>' +
    '<div><b>±7</b><span>typical margin</span></div>' +
  '</div>' +
  '<section class="stack">' +
    '<h3>Sections</h3>' +
    '<div class="sections">' + SECTIONS.map(function (s, i) {
      return '<div class="row"><span class="n">' + (i + 1) + '</span><div><b>' + s.name + '</b><p>' + s.what + '</p></div><span class="t">' +
        s.items.length + ' items · ' + (s.minutes ? s.minutes + ' min' : 'untimed') + '</span></div>';
    }).join('') + '</div>' +
  '</section>' +
  '<section class="panel">' +
    '<h3>Try a sample puzzle</h3>' +
    '<div class="sample">' + matrixGrid(SAMPLE_GRID) +
      '<div class="stack"><p>Each row keeps one shape. Across each row the shading goes empty, grey, solid. Which figure goes in the blank?</p>' +
      '<div class="opts">' + SAMPLE_OPTS.map(function (o, i) {
        var cls = sample === null ? '' : (i === 1 ? ' right' : (sample === i ? ' wrong' : ''));
        return '<button class="opt' + cls + '" data-sample="' + i + '" aria-label="Sample option ' + (i + 1) + '">' + cellSVG(o) + '</button>';
      }).join('') + '</div>' +
      (sample === null ? '' : '<p class="note">' + (sample === 1 ? 'Correct. Diamond row, solid column.' : 'Not quite. The bottom row is diamonds and the last column is solid, so it is the solid diamond.') + '</p>') +
      '</div></div>' +
  '</section>' +
  '<section class="stack">' +
    '<h3>Before you start</h3>' +
    '<ul class="plain">' +
      '<li>Find a quiet place and about 30 minutes. Each section has its own clock that keeps running if you switch tabs.</li>' +
      '<li>No calculator, notes, search or help from others. Any of these will inflate your score and make it meaningless.</li>' +
      '<li>Within a timed section you can skip items and come back. A blank answer counts as wrong, so guess if time is short.</li>' +
      '<li>Take it only once. A second attempt is inflated by practice.</li>' +
    '</ul>' +
  '</section>' +
  '<div class="actions"><button class="btn" data-act="start">Start the test</button>' +
    (last ? '<span class="note">Your last result on this device: ' + last.iq + ' (' + last.lo + '–' + last.hi + ')</span>' : '') +
  '</div>' +
  accuracyHTML();
}

function accuracyHTML() {
  return '<section class="panel">' +
    '<h3>How accurate is this?</h3>' +
    '<p class="note">Clinical tests such as the WAIS are given one-on-one by a psychologist and normed on thousands of people. This test follows the same design principles: several distinct abilities, items of graded difficulty, time limits, and item-response scoring that accounts for guessing and reports a confidence range. Its item difficulties are calibrated from published research on these item types, not from a norming sample of its own, so treat the number as a reasonable estimate rather than a diagnosis. It measures most precisely between about 75 and 130. The verbal section assumes fluent English.</p>' +
  '</section>';
}

function sectionIntroHTML() {
  var s = SECTIONS[S.sec];
  return '' +
  (S.timedOut ? '<div class="confirm"><span>Time ran out on the previous section. Unanswered items count as wrong.</span></div>' : '') +
  '<header class="stack">' +
    '<span class="eyebrow">Section ' + (S.sec + 1) + ' of ' + SECTIONS.length + '</span>' +
    '<h2>' + s.name + '</h2>' +
    '<p class="lead">' + s.what + '</p>' +
  '</header>' +
  '<div class="panel"><p>' + s.how + '</p>' +
    '<p class="note">' + s.items.length + ' items · ' + (s.minutes ? s.minutes + ' minutes. The clock starts when you press Begin.' : 'no time limit') + '</p></div>' +
  '<div class="actions"><button class="btn" data-act="begin">Begin section</button></div>';
}

function barHTML(s) {
  var answered = function (it) { var a = S.ans[it.id]; return a !== undefined && a !== null && a !== ''; };
  return '<div class="bar">' +
    '<div class="bar-top"><span class="eyebrow">' + (S.sec + 1) + ' / ' + SECTIONS.length + ' · ' + s.name + '</span>' +
    (s.minutes ? '<span class="clock" id="clock">' + fmt(S.deadline - Date.now()) + '</span>' : '') + '</div>' +
    (s.key === 'memory' ? '' :
      '<div class="dots">' + s.items.map(function (it, i) {
        return '<button class="dot' + (answered(it) ? ' done' : '') + (i === S.idx ? ' cur' : '') + '" data-jump="' + i + '" id="dot-' + it.id + '" aria-label="Item ' + (i + 1) + '">' + (i + 1) + '</button>';
      }).join('') + '</div>') +
  '</div>';
}

function questionHTML() {
  var s = SECTIONS[S.sec];
  if (s.key === 'memory') return barHTML(s) + memoryHTML(s);
  var it = s.items[S.idx];
  var a = S.ans[it.id];
  var body = '';
  if (it.type === 'matrix') {
    body = matrixGrid(it.grid) +
      '<div class="opts">' + it.options.map(function (cell, i) {
        return '<button class="opt' + (a === i ? ' on' : '') + '" data-opt="' + i + '" aria-label="Option ' + (i + 1) + '" aria-pressed="' + (a === i) + '"><span class="k">' + (i + 1) + '</span>' + cellSVG(cell) + '</button>';
      }).join('') + '</div>';
  } else if (it.type === 'series') {
    body = '<p class="stem">What number comes next?</p>' +
      '<div class="seq">' + it.seq.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '<span class="q">?</span></div>' +
      '<input class="num-in" id="in-' + it.id + '" inputmode="numeric" autocomplete="off" aria-label="Your answer" value="' + esc(a || '') + '">';
  } else {
    body = '<p class="stem">' + esc(it.stem) + '</p>' +
      '<div class="vopts">' + it.options.map(function (o, i) {
        return '<button class="vopt' + (a === i ? ' on' : '') + '" data-opt="' + i + '" aria-pressed="' + (a === i) + '"><span class="k">' + 'ABCDE'[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>';
  }
  var unanswered = s.items.filter(function (x) { var v = S.ans[x.id]; return v === undefined || v === null || v === ''; }).length;
  var last = S.idx === s.items.length - 1;
  return barHTML(s) +
    '<div class="stack"><span class="eyebrow">Item ' + (S.idx + 1) + ' of ' + s.items.length + '</span>' + body + '</div>' +
    (S.confirm ?
      '<div class="confirm"><span>' + unanswered + ' item' + (unanswered === 1 ? ' is' : 's are') + ' unanswered and will count as wrong.</span>' +
      '<div class="actions"><button class="btn ghost" data-act="cancel">Keep working</button><button class="btn" data-act="finish-now">Finish section</button></div></div>' : '') +
    '<div class="qfoot">' +
      '<button class="btn ghost" data-act="prev"' + (S.idx === 0 ? ' disabled' : '') + '>Back</button>' +
      '<div class="actions">' +
        (last ? '' : '<button class="btn ghost" data-act="finish">Finish section</button>') +
        '<button class="btn" data-act="' + (last ? 'finish' : 'next') + '">' + (last ? 'Finish section' : 'Next') + '</button>' +
      '</div>' +
    '</div>' +
    '<p class="note">' + (it.type === 'series' ? 'Press Enter to go to the next item.' : 'Keyboard: press ' + (it.type === 'matrix' ? '1–8' : 'A–' + 'ABCDE'[it.options.length - 1]) + ' to choose, Enter for next.') + '</p>';
}

function memoryHTML(s) {
  var m = S.mem, it = s.items[m.trial];
  var head = '<span class="eyebrow">Trial ' + (m.trial + 1) + ' of ' + s.items.length + ' · ' + it.digits.length + ' digits</span>';
  if (m.phase === 'ready') {
    return '<div class="stack">' + head + '<div class="digit-stage"><span class="note">Digits appear here, one per second.</span></div>' +
      '<div class="actions"><button class="btn" data-act="mem-go">Show ' + it.digits.length + ' digits</button></div></div>';
  }
  if (m.phase === 'show') {
    var d = m.shown >= 0 ? it.digits[m.shown] : '';
    return '<div class="stack">' + head + '<div class="digit-stage" aria-live="assertive">' + (d ? '<span class="digit" id="digit">' + d + '</span>' : '<span class="note">Get ready…</span>') + '</div></div>';
  }
  return '<div class="stack">' + head +
    '<p class="stem">Type the digits in reverse order.</p>' +
    '<input class="num-in" id="mem-in" inputmode="numeric" autocomplete="off" aria-label="Digits in reverse order">' +
    '<div class="actions"><button class="btn" data-act="mem-submit">Submit</button></div></div>';
}

function curveSVG(iq) {
  var W = 640, H = 170, x0 = 20, x1 = 620, base = 132, top = 18;
  var X = function (v) { return x0 + (v - 40) / 120 * (x1 - x0); };
  var Y = function (v) { var z = (v - 100) / 15; return base - Math.exp(-z * z / 2) * (base - top); };
  var pts = [], shade = [];
  for (var v = 40; v <= 160; v += 1) {
    pts.push(X(v).toFixed(1) + ',' + Y(v).toFixed(1));
    if (v <= Math.min(Math.max(iq, 40), 160)) shade.push(X(v).toFixed(1) + ',' + Y(v).toFixed(1));
  }
  var cx = X(Math.min(Math.max(iq, 40), 160));
  var ticks = [55, 70, 85, 100, 115, 130, 145].map(function (t) {
    return '<line x1="' + X(t) + '" y1="' + base + '" x2="' + X(t) + '" y2="' + (base + 5) + '" style="stroke:var(--muted)"/>' +
      '<text x="' + X(t) + '" y="' + (base + 22) + '" text-anchor="middle" style="fill:var(--muted);font:12px var(--f-mono)">' + t + '</text>';
  }).join('');
  return '<svg class="curve" viewBox="0 0 ' + W + ' ' + (H + 10) + '" role="img" aria-label="Bell curve with your score marked at ' + iq + '">' +
    '<polygon points="' + X(40) + ',' + base + ' ' + shade.join(' ') + ' ' + cx.toFixed(1) + ',' + base + '" style="fill:var(--sel)"/>' +
    '<polyline points="' + pts.join(' ') + '" style="fill:none;stroke:var(--ink);stroke-width:2"/>' +
    '<line x1="' + x0 + '" y1="' + base + '" x2="' + x1 + '" y2="' + base + '" style="stroke:var(--line);stroke-width:1.5"/>' +
    ticks +
    '<line x1="' + cx.toFixed(1) + '" y1="' + (top - 6) + '" x2="' + cx.toFixed(1) + '" y2="' + base + '" style="stroke:var(--accent);stroke-width:3"/>' +
    '<circle cx="' + cx.toFixed(1) + '" cy="' + (top - 6) + '" r="5" style="fill:var(--accent)"/>' +
  '</svg>';
}

function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function shareText(R) {
  return 'I scored ' + R.iq + ' on the Four-Domain IQ Test (90% range ' + R.lo + '–' + R.hi + ', ' + ordinal(Math.max(1, Math.min(99, Math.round(R.pct)))) + ' percentile). Think you can beat it?';
}

function resultsHTML() {
  var R = S.result;
  var pct = Math.max(1, Math.min(99, Math.round(R.pct)));
  var pos = function (v) { return Math.max(0, Math.min(100, (v - 55) / 90 * 100)); };
  return '' +
  '<header class="stack"><span class="eyebrow">Your result</span>' +
  '<div class="score"><span class="big">' + R.iq + '</span>' +
    '<div class="meta"><span class="band">' + R.band + '</span>' +
    '<span>90% confidence range <b>' + R.lo + '–' + R.hi + '</b></span>' +
    '<span>Higher than about <b>' + pct + '%</b> of people</span>' +
    '<span class="note">' + R.raw + ' of ' + R.total + ' items correct</span></div>' +
  '</div></header>' +
  '<section class="panel">' + curveSVG(R.iq) +
    '<p class="note">The shaded area is the share of the population expected to score below you. About two-thirds of people score between 85 and 115.</p></section>' +
  '<section class="stack"><h3>By section</h3>' +
    '<p class="note">Each section gets its own index on the same scale. With only 6 to 12 items per section the ranges are wide, so read these as relative strengths rather than separate scores.</p>' +
    '<div class="domains">' + R.domains.map(function (d) {
      return '<div class="dom"><span class="lab">' + d.name + '<small>' + d.right + ' / ' + d.n + ' correct</small></span>' +
        '<div class="track" aria-hidden="true"><span class="ci" style="left:' + pos(d.index - d.half) + '%;right:' + (100 - pos(d.index + d.half)) + '%"></span><span class="mid"></span><span class="pt" style="left:' + pos(d.index) + '%"></span></div>' +
        '<span class="v">' + d.index + '</span></div>';
    }).join('') + '</div>' +
    '<p class="note">Bar scale runs 55 to 145; the center line is 100.</p>' +
  '</section>' +
  '<section class="panel"><h3>Share your score</h3>' +
    '<textarea class="share-text" id="share-text" rows="3" readonly>' + esc(shareText(R)) + '</textarea>' +
    '<div class="actions"><button class="btn" data-act="copy" id="copy-btn">Copy text</button><span class="note">Send it along with the link to this page. The answers are not shown so the test stays fair for others.</span></div>' +
  '</section>' +
  accuracyHTML() +
  '<div class="actions"><button class="btn ghost" data-act="restart">Back to start</button></div>';
}

function render() {
  var h = S.screen === 'intro' ? introHTML() : S.screen === 'secIntro' ? sectionIntroHTML() : S.screen === 'q' ? questionHTML() : resultsHTML();
  app.innerHTML = h;
  var inp = app.querySelector('.num-in');
  if (inp) inp.focus();
}

/* ---------- flow ---------- */
function beginSection() {
  var s = SECTIONS[S.sec];
  S.screen = 'q'; S.idx = 0; S.confirm = false; S.timedOut = false;
  S.deadline = s.minutes ? Date.now() + s.minutes * 60000 : 0;
  S.mem = {trial: 0, phase: 'ready', shown: -1};
  render(); window.scrollTo(0, 0);
}
function endSection(timedOut) {
  S.sec++; S.deadline = 0; S.confirm = false; S.timedOut = !!timedOut;
  if (S.sec >= SECTIONS.length) {
    S.result = scoreAll(S.ans);
    save('fdiq-last', {iq: S.result.iq, lo: S.result.lo, hi: S.result.hi});
    S.screen = 'results';
  } else S.screen = 'secIntro';
  render(); window.scrollTo(0, 0);
}
function go(i) {
  var s = SECTIONS[S.sec];
  S.idx = Math.max(0, Math.min(s.items.length - 1, i)); S.confirm = false;
  render();
}
function choose(i) {
  var it = SECTIONS[S.sec].items[S.idx];
  if (i < 0 || i >= it.options.length) return;
  S.ans[it.id] = i; render();
}
function tryFinish() {
  var s = SECTIONS[S.sec];
  var un = s.items.filter(function (x) { var v = S.ans[x.id]; return v === undefined || v === null || v === ''; }).length;
  if (un > 0 && !S.confirm) { S.confirm = true; render(); } else endSection(false);
}

var memTimer = null;
function memShow() {
  var it = SECTIONS[S.sec].items[S.mem.trial];
  S.mem.phase = 'show'; S.mem.shown = -1; render();
  var k = -1;
  function step() {
    k++;
    if (k < it.digits.length) {
      S.mem.shown = k; render();
      memTimer = setTimeout(function () { S.mem.shown = -2; var el = document.getElementById('digit'); if (el) el.textContent = ''; memTimer = setTimeout(step, 200); }, 900);
    } else { S.mem.phase = 'input'; render(); }
  }
  memTimer = setTimeout(step, 800);
}
function memSubmit() {
  var s = SECTIONS[S.sec], it = s.items[S.mem.trial];
  var el = document.getElementById('mem-in');
  S.ans[it.id] = el ? el.value : '';
  if (S.mem.trial + 1 >= s.items.length) { endSection(false); return; }
  S.mem = {trial: S.mem.trial + 1, phase: 'ready', shown: -1}; render();
}

app.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  if (t.dataset.sample !== undefined) { S.sample = Number(t.dataset.sample); render(); return; }
  if (t.dataset.opt !== undefined) { choose(Number(t.dataset.opt)); return; }
  if (t.dataset.jump !== undefined) { go(Number(t.dataset.jump)); return; }
  var a = t.dataset.act;
  if (a === 'start') { S = fresh(); S.screen = 'secIntro'; render(); window.scrollTo(0, 0); }
  else if (a === 'begin') beginSection();
  else if (a === 'prev') go(S.idx - 1);
  else if (a === 'next') go(S.idx + 1);
  else if (a === 'finish') tryFinish();
  else if (a === 'finish-now') endSection(false);
  else if (a === 'cancel') { S.confirm = false; render(); }
  else if (a === 'mem-go') memShow();
  else if (a === 'mem-submit') memSubmit();
  else if (a === 'restart') { S = fresh(); render(); window.scrollTo(0, 0); }
  else if (a === 'copy') {
    var ta = document.getElementById('share-text');
    var done = function () { t.textContent = 'Copied'; setTimeout(function () { t.textContent = 'Copy text'; }, 1800); };
    var fallback = function () { ta.focus(); ta.select(); t.textContent = 'Press Ctrl+C to copy'; };
    try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
  }
});

app.addEventListener('input', function (e) {
  if (!e.target.id || e.target.id.indexOf('in-') !== 0) return;
  var it = SECTIONS[S.sec].items[S.idx];
  e.target.value = e.target.value.replace(/[^\d-]/g, '');
  S.ans[it.id] = e.target.value;
  var dot = document.getElementById('dot-' + it.id);
  if (dot) dot.classList.toggle('done', e.target.value !== '');
});

document.addEventListener('keydown', function (e) {
  if (S.screen !== 'q' || e.ctrlKey || e.metaKey || e.altKey) return;
  var s = SECTIONS[S.sec];
  if (s.key === 'memory') {
    if (e.key === 'Enter' && S.mem.phase === 'input') { e.preventDefault(); memSubmit(); }
    return;
  }
  var it = s.items[S.idx];
  if (e.key === 'Enter') {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (S.idx < s.items.length - 1) go(S.idx + 1); else tryFinish();
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (it.type === 'matrix' && /^[1-8]$/.test(e.key)) choose(Number(e.key) - 1);
  if (it.type === 'verbal') {
    var k = e.key.toUpperCase();
    var i = 'ABCDE'.indexOf(k);
    if (k.length === 1 && i >= 0) choose(i);
  }
});

setInterval(function () {
  if (S.screen !== 'q' || !S.deadline) return;
  var left = S.deadline - Date.now();
  if (left <= 0) { clearTimeout(memTimer); endSection(true); return; }
  var el = document.getElementById('clock');
  if (el) { el.textContent = fmt(left); el.classList.toggle('low', left < 60000); }
}, 250);

render();
</script>
</body>
</html>
